# Local/test stack. Use PHP-FPM + an HTTPS reverse proxy for production.
services:
  app:
    build: .
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      PURO_RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${PURO_HTTP_PORT:-8000}:8000"
    volumes:
      - puro_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-purocare}
      POSTGRES_USER: ${DB_USERNAME:-puro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PURO_DB_PORT:-5432}:5432"
    volumes:
      - puro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  puro_storage:
  puro_postgres:
